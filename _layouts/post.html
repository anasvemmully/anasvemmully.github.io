<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/post-style/post-style.css">
    <title>Portfolio</title>
</head>

<body>

    
    <div class="post-container ">
        {% include navigation.html %}
        <div class="post-grid-container">
            {% if page.author %} 
                <div class="post-author">✎ {{ page.author }}</div>
            {% endif %}
            <div>
                <span class="post-date">{{ page.date | date_to_string }}</span> |  
                <span class="post-time">{{ page.time }} min read</span>
            </div>
            <div class="post-title">{{ page.title }}</div>
            {% if page.cover-image %}
            <div class="post-hero fullwidth">
                <div class="blur-cover" style="background-image: url('{{ site.cover_base_url }}{{ page.cover-image }}')"></div>
                <div class="fullwidth image-cover" style="background-image: url('{{ site.cover_base_url }}{{ page.cover-image }}')"></div>
            </div>
            {% endif %}

            <div class="content">
                {{ content | markdownify }}
            </div>
        </div>

    </div>

    {% include footer.html %}

    {% include particle-background.html %}

    <script src="/assets/scripts/image-viewer.js"></script>

</body>

</html>

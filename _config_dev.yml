# Local development configuration override
# Use with: bundle exec jekyll serve --config _config_dev.yml

title: Portfolio
email: anasvemmully@gmail.com
status: 💼 Open for work
baseurl: ""
cover_base_url: /assets/images/posts/cover/
post_images_url: /assets/images/posts/image/
url: "http://localhost:4000"

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets/media/"
    values:
      sitemap: false

paginate: 6
paginate_path: "/blog/page:num/"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
